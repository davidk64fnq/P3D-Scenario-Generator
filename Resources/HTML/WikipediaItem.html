<!DOCTYPE HTML>
<HTML>
	<head>
		<script src="scriptsWikipediaItem.js" defer=""></script>
		<style>
			html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background-color: rgb(240, 248, 255); /* Outer panel background */
			overflow: hidden;
			}

			/* Mobile viewport container centered inside your P3D window */
			#viewport {
			width: 480px;            /* Fixed mobile phone width */
			height: 100%;            /* Fills 100% of available vertical space */
			margin: 0 auto;          /* Centers horizontally */
			background-color: #ffffff;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); /* Subtle shadow around frame */
			}

			/* Standard iframe filling the 480px viewport */
			#item-iframe {
			width: 100%;
			height: 100%;
			border: none;
			}
		</style>
	</head>
	<body>
		<div id="viewport">
			<iframe id="item-iframe" src=""></iframe>
		</div>
	</body>
</HTML>
