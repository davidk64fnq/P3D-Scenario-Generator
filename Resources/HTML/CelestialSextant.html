<!DOCTYPE HTML>
<HTML>	
<head>
	<link rel="stylesheet" href="styleCelestialSextant.css"></link>
    <style>
    </style>
</head>
<body>
	<div class="nav-tabs">
		<button class="tablink" onclick="openPage('Star Chart')">Star Chart</button>
		<button class="tablink" onclick="openPage('Sight Reduction')">Sight Reduction</button>
		<button class="tablink" onclick="openPage('Plotting')">Plotting</button>
		<button class="tablink" onclick="openPage('Tables')">Tables</button>
	</div>

    <!--
    <div id="app-status">
        <p style="color: blue;">[INFO] Application initializing...</p>
    </div>
    -->

    <div id="Star Chart" class="tabcontent">
        <div id="INFO">
            <button type="button" onclick="toggleStarNamesWrapper()">Star Names</button>
            <button type="button" onclick="toggleConstellationLinesWrapper()">Constellation Lines</button>
            <button type="button" onclick="toggleConstellationNamesWrapper()">Constellation Names</button>
			<button type="button" onclick="updateVisibleStarsTableWrapper()">Update Stars Table</button>
        </div>
        <div id="FIX">
            <button type="button" onclick="takeSightingWrapper()">Take Sighting</button>
        </div>
        <div>
            <canvas id="canvas" width="960" height="540"></canvas>
        </div>
		<div class="controls-row">
			<div id="FOV">
				<button type="button" onclick="setFOVWrapper(100)">100°</button>
				<button type="button" onclick="setFOVWrapper(50)">50°</button>
				<button type="button" onclick="setFOVWrapper(20)">20°</button>
				<button type="button" onclick="setFOVWrapper(6)">6°</button>
			</div>

			<div id="AZ">
				<button type="button" onclick="adjustAZWrapper(-45)">-45°</button>
				<button type="button" onclick="adjustAZWrapper(-1)">-1°</button>
				<button type="button" onclick="moveAZresetWrapper()">AZ</button>
				<button type="button" onclick="adjustAZWrapper(1)">+1°</button>
				<button type="button" onclick="adjustAZWrapper(45)">+45°</button>
			</div>

            <div id="ALT">
                <button type="button" onclick="adjustALTWrapper(10)">+10°</button>
                <button type="button" onclick="adjustALTWrapper(1)">+1°</button>
                <button type="button" onclick="moveALTresetWrapper()">ALT</button>
                <button type="button" onclick="adjustALTWrapper(-1)">-1°</button>
                <button type="button" onclick="adjustALTWrapper(-10)">-10°</button>
            </div>

			<div id="Ho">
				<button type="button" onclick="adjustHoWrapper(-1)">+1</button>
				<button type="button" onclick="adjustHoWrapper(-10)">+10</button>
				<button type="button" onclick="adjustHoWrapper(-50)">+50</button>
				<button type="button" onclick="moveHoresetWrapper()">Ho</button>
				<button type="button" onclick="adjustHoWrapper(50)">-50</button>
				<button type="button" onclick="adjustHoWrapper(10)">-10</button>
				<button type="button" onclick="adjustHoWrapper(1)">-1</button>
			</div>
		</div>
    </div>

    <div id="Sight Reduction" class="tabcontent">
        <div id="clearSightings">
            <button type="button" onclick="clearSightingsDisplay()">Clear Sightings Display</button>
            <button type="button" onclick="deleteLastSighting()">Delete Last Sighting</button>
        </div>
        <table>
            <tr>
                <th>Sight #</th>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <th>Star</th>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
                <td><select class="starName" onfocus='this.size=20;' onblur='this.size=1;' onchange='this.size=1; this.blur()' style="width: 115px;">starOptionsX</select></td>
            </tr>
            <tr>
                <th>AP Latitude</th>
                <td><input type="text" class="AP Lat" size="10"></input></td>
                <td><input type="text" class="AP Lat" size="10"></input></td>
                <td><input type="text" class="AP Lat" size="10"></input></td>
                <td><input type="text" class="AP Lat" size="10"></input></td>
                <td><input type="text" class="AP Lat" size="10"></input></td>
                <td><input type="text" class="AP Lat" size="10"></input></td>
            </tr>
            <tr>
                <th>AP Longitude</th>
                <td><input type="text" class="AP Lon" size="10"></input></td>
                <td><input type="text" class="AP Lon" size="10"></input></td>
                <td><input type="text" class="AP Lon" size="10"></input></td>
                <td><input type="text" class="AP Lon" size="10"></input></td>
                <td><input type="text" class="AP Lon" size="10"></input></td>
                <td><input type="text" class="AP Lon" size="10"></input></td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Date</th>
                <td class="Date"></td>
                <td class="Date"></td>
                <td class="Date"></td>
                <td class="Date"></td>
                <td class="Date"></td>
                <td class="Date"></td>
            </tr>
            <tr>
                <th>UT</th>
                <td class="UT"></td>
                <td class="UT"></td>
                <td class="UT"></td>
                <td class="UT"></td>
                <td class="UT"></td>
                <td class="UT"></td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Hs (Ho)</th>
                <td class="Hs"></td>
                <td class="Hs"></td>
                <td class="Hs"></td>
                <td class="Hs"></td>
                <td class="Hs"></td>
                <td class="Hs"></td>
            </tr>
        </table>
        <table>
            <tr>
                <td style="text-align: left;">GHA &#9800;</td>
                <td class="GHAhour"></td>
                <td class="GHAhour"></td>
                <td class="GHAhour"></td>
                <td class="GHAhour"></td>
                <td class="GHAhour"></td>
                <td class="GHAhour"></td>
            </tr>
            <tr>
                <td style="text-align: left;">GHA &#9800; incr.</td>
                <td class="GHAinc"></td>
                <td class="GHAinc"></td>
                <td class="GHAinc"></td>
                <td class="GHAinc"></td>
                <td class="GHAinc"></td>
                <td class="GHAinc"></td>
            </tr>
            <tr>
                <td style="text-align: left;">SHA &#10017; incr.</td>
                <td class="SHAinc"></td>
                <td class="SHAinc"></td>
                <td class="SHAinc"></td>
                <td class="SHAinc"></td>
                <td class="SHAinc"></td>
                <td class="SHAinc"></td>
            </tr>
            <tr>
                <th style="text-align: right;">GHA &#10017;</th>
                <td class="GHAtotal"></td>
                <td class="GHAtotal"></td>
                <td class="GHAtotal"></td>
                <td class="GHAtotal"></td>
                <td class="GHAtotal"></td>
                <td class="GHAtotal"></td>
            </tr>
            <tr>
                <th style="text-align: left;">Dec</th>
                <td class="Dec"></td>
                <td class="Dec"></td>
                <td class="Dec"></td>
                <td class="Dec"></td>
                <td class="Dec"></td>
                <td class="Dec"></td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Hc</th>
                <td class="Hc"></td>
                <td class="Hc"></td>
                <td class="Hc"></td>
                <td class="Hc"></td>
                <td class="Hc"></td>
                <td class="Hc"></td>
            </tr>
            <tr>
                <th>Zn</th>
                <td class="Zn"></td>
                <td class="Zn"></td>
                <td class="Zn"></td>
                <td class="Zn"></td>
                <td class="Zn"></td>
                <td class="Zn"></td>
            </tr>
            <tr>
                <th>Intercept</th>
                <td class="Intercept"></td>
                <td class="Intercept"></td>
                <td class="Intercept"></td>
                <td class="Intercept"></td>
                <td class="Intercept"></td>
                <td class="Intercept"></td>
            </tr>
        </table>
    </div>

    <div id="Plotting" class="tabcontent">
        <div id="plotFinalLeg">
            <button type="button" id="finalLegButton" onclick="plotFinalLegWrapper()">Show Leg Info</button>
            <button type="button" id="hideButton" onclick="hidePlaneWrapper()">Hide Plane</button>
            <button type="button" id="showButton" onclick="showPlaneWrapper()">Show Plane</button>
        </div>
		<div id="plotMapContainer">
			<canvas id="plottingCanvas" width="960" height="540"></canvas>
			<img id="plane" src="aircraft.png" />
		</div>
    </div>

	<div id="Tables" class="tabcontent" style="text-align: center;">

		<!-- Table Container -->
		<div id="visibleStarsContainer" style="width: 860px; margin: 0 auto 10px auto;">
			<table id="visibleStarsTable" style="width: 860px; margin: 0 auto; border-collapse: collapse; text-align: center; table-layout: fixed;">
				<thead>
					<tr style="border-bottom: 2px solid #ccc; height: 32px;">
						<th style="width: 100px;">SHA Index</th>
						<th style="width: 200px;">Nav Star Name</th>
						<th style="width: 240px;">Constellation</th>
						<th style="width: 120px;">Bayer</th>
						<th style="width: 100px;">Mag</th>
					</tr>
				</thead>
				<tbody id="visibleStarsBody">
					<tr>
						<td colspan="5" style="text-align: center; padding: 12px;">
							Click "Update Stars Table" on Star Chart to populate visible stars.
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- Constellation Viewer -->
		<div id="constellationViewer" style="width: 860px; margin: 0 auto 10px auto; background-color: #ffffff; border: 1px solid #d0d7de; border-radius: 4px; padding: 10px 0; text-align: center;">
			<img id="constellationImg"
				 src="Constellations/navstarchart.bmp"
				 alt="Chart Display Area"
				 style="max-width: 840px; width: auto; height: auto; display: block; margin: 0 auto; border: 0;" />
		</div>

	</div>
	
    <script src="types.js"></script>
    <script src="scriptsCelestialAstroCalcs.js"></script>
    <script src="scriptsCelestialSextant.js"></script>
	<script>
		// Open the Star Chart tab by default when the scenario loads
		openPage('Star Chart');
	</script>
</body>
</HTML>
